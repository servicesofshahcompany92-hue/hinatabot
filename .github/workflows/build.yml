name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev autoconf automake \
          libtool pkg-config libffi-dev libssl-dev cmake gettext zip unzip lld clang
        python -m pip install --upgrade pip setuptools
        pip install "Cython==0.29.33" "buildozer==1.5.0"

    - name: Pre-Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android/licenses
        echo -e "893301122459683e100f4857330a08e033f42460\nd93507010450a90e5b4999398458347f3053d26c\n24333f8a63b68250914e637f75e22db3fc023696" > ~/.android/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HinataBot-APK
        path: bin/*.apk
